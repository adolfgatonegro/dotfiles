<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<alias>
		<family>serif</family>
		<prefer><family>Adobe Garamond Pro</family></prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer><family>DINPro</family></prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer><family>Agave Nerd Font</family></prefer>
	</alias>
</fontconfig>
